<header>

<a href="/" title="Home" class="{{#is_active}}/{{/is_active}}"><strong>{{title}}</strong></a>

<nav class="tags">
{{#all_tags}}
<a href="/tagged/{{slug}}" title="{{name}}" class="{{active}}">{{name}}</a>
{{/all_tags}}
</nav>

<nav class="menu">
{{#menu}}
<a href="{{{url}}}" title="{{label}}" class="{{active}}">{{label}}</a>
{{/menu}}
</nav>

</header>
