<div class="entry">

  <a class="full" href="{{{url}}}"></a>

  {{#thumbnail.medium}}
  <img class="thumb" src="{{{url}}}" width="{{width}}" height="{{height}}" alt="{{title}}"/>
  {{/thumbnail.medium}}

  {{^thumbnail.medium}}
  {{#thumbnail.small}}
  <img class="thumb" src="{{{url}}}" width="{{width}}" height="{{height}}" alt="{{title}}"/>
  {{/thumbnail.small}}

  {{^thumbnail.small}}
  <div class="teaser">
    {{{titleTag}}}
    {{{teaser}}}
  </div>
  {{/thumbnail.small}}
  {{/thumbnail.medium}}
</div>
