name: Deploy to EC2

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to deploy from"
        required: false
        default: "master"
      commit:
        description: "Optional commit hash or short code on that branch (defaults to the tip of the branch)"
        required: false
        default: ""

permissions:
  contents: read

env:
  REGISTRY_URL: ghcr.io/davidmerfield/blot
  AIRLOCK_REGISTRY_URL: ghcr.io/davidmerfield/blot-airlock
  BLOT_DEPLOY_SSH_HOST: ${{ secrets.BLOT_DEPLOY_SSH_HOST }}

jobs:
  wait-for-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history so an arbitrary/older commit or short code can be
          # resolved and verified against the target branch.
          fetch-depth: 0

      - name: Resolve target commit
        id: resolve
        run: |
          REF="${{ github.event.inputs.ref }}"
          REF="${REF:-master}"
          COMMIT="${{ github.event.inputs.commit }}"

          git fetch --quiet origin "$REF"

          if [ -n "$COMMIT" ]; then
            SHA=$(git rev-parse --verify --quiet "${COMMIT}^{commit}") || {
              echo "❌ Error: could not resolve commit '$COMMIT'"
              exit 1
            }
            if ! git merge-base --is-ancestor "$SHA" "origin/$REF"; then
              echo "❌ Error: commit $SHA is not on branch '$REF'"
              exit 1
            fi
          else
            SHA=$(git rev-parse --verify "origin/$REF^{commit}")
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "✅ Target commit: $SHA (branch $REF)"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for build images to be available
        run: |
          IMAGE="${{ env.REGISTRY_URL }}:${{ steps.resolve.outputs.sha }}"
          AIRLOCK_IMAGE="${{ env.AIRLOCK_REGISTRY_URL }}:${{ steps.resolve.outputs.sha }}"
          WAIT_INTERVAL=10

          # The app image is required.
          echo "Waiting for app image: $IMAGE"
          for i in $(seq 1 150); do   # up to 25 min
            if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
              echo "✅ App image found: $IMAGE"
              break
            fi
            if [ "$i" -eq 150 ]; then
              echo "❌ Timeout: app image not found after 25 minutes: $IMAGE"
              exit 1
            fi
            echo "  not ready yet ($i/150)..."; sleep $WAIT_INTERVAL
          done

          # The airlock image is best-effort. build-airlock runs in parallel
          # with the app build and is usually a little slower (Alpine +
          # Chromium + the verify step), so give it a bounded grace window
          # once the app image is up - but do NOT let it block the deploy:
          # deployAirlockIfNeeded() in scripts/deploy already skips a missing
          # airlock manifest non-fatally, and an airlock build failure must
          # not be able to hold up an app hotfix.
          echo "Waiting (best-effort) for airlock image: $AIRLOCK_IMAGE"
          for i in $(seq 1 30); do   # up to 5 min
            if docker manifest inspect "$AIRLOCK_IMAGE" > /dev/null 2>&1; then
              echo "✅ Airlock image found: $AIRLOCK_IMAGE"
              exit 0
            fi
            echo "  not ready yet ($i/30)..."; sleep $WAIT_INTERVAL
          done

          echo "::warning::Airlock image $AIRLOCK_IMAGE not available after the grace period - the deploy will run, but scripts/deploy will skip the airlock update for this commit (see deployAirlockIfNeeded). Re-deploy this commit once build-airlock succeeds."

  deploy:
    needs: wait-for-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.wait-for-build.outputs.sha }}
          fetch-depth: 0

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BLOT_DEPLOY_SSH_KEY }}

      - name: Configure SSH alias
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat >> ~/.ssh/config << EOF
          Host blot
            HostName ${BLOT_DEPLOY_SSH_HOST}
            User deploy
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify SSH connection
        run: ssh blot "echo 'SSH connection successful'"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: "npm"
          cache-dependency-path: ./package.json

      - name: Cache Node modules and the Puppeteer browser
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/puppeteer
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-22-${{ hashFiles('package.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm install

      - name: Deploy via npm script
        run: npm run deploy-node -- ${{ needs.wait-for-build.outputs.sha }}
        env:
          # Skip branch check since we're in CI and may be checking out a specific commit
          SKIP_BRANCH_CHECK: true

      - name: Deployment summary
        if: success()
        run: |
          echo ""
          echo "=========================================="
          echo "Deployment Summary"
          echo "=========================================="
          echo "Branch:     ${{ needs.wait-for-build.outputs.ref }}"
          echo "Commit SHA: ${{ needs.wait-for-build.outputs.sha }}"
          echo "Deployment completed successfully! 🚀"
