name: Deploy to EC2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY_URL: ghcr.io/davidmerfield/blot
  AIRLOCK_REGISTRY_URL: ghcr.io/davidmerfield/blot-airlock
  BLOT_DEPLOY_SSH_HOST: ${{ secrets.BLOT_DEPLOY_SSH_HOST }}

jobs:
  wait-for-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/master" ]; then
            echo "❌ Error: This workflow can only be run on the master branch."
            echo "Current branch: ${{ github.ref }}"
            exit 1
          fi
          echo "✅ Branch check passed: running on master branch"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for build images to be available
        run: |
          echo "Waiting for build images to be available..."

          # Both images, not just the app one: scripts/deploy/index.js's
          # deployAirlockIfNeeded() treats a missing airlock manifest for
          # this commit as a non-fatal SKIP, with nothing that retries it
          # later - so if this workflow is dispatched while build-airlock
          # is still running (or it fails independently of the app's own
          # build job), the app image can go out without the sidecar ever
          # being updated for that commit, silently.
          IMAGE="${{ env.REGISTRY_URL }}:${{ github.sha }}"
          AIRLOCK_IMAGE="${{ env.AIRLOCK_REGISTRY_URL }}:${{ github.sha }}"
          MAX_WAIT_MINUTES=30
          WAIT_INTERVAL=10
          MAX_ITERATIONS=$((MAX_WAIT_MINUTES * 60 / WAIT_INTERVAL))
          ITERATION=0

          while [ $ITERATION -lt $MAX_ITERATIONS ]; do
            APP_READY=false
            AIRLOCK_READY=false
            docker manifest inspect "$IMAGE" > /dev/null 2>&1 && APP_READY=true
            docker manifest inspect "$AIRLOCK_IMAGE" > /dev/null 2>&1 && AIRLOCK_READY=true

            if [ "$APP_READY" = true ] && [ "$AIRLOCK_READY" = true ]; then
              echo "✅ Build images found: $IMAGE, $AIRLOCK_IMAGE"
              exit 0
            fi

            echo "Not ready yet (app=${APP_READY} airlock=${AIRLOCK_READY}). Waiting ${WAIT_INTERVAL} seconds... (attempt $((ITERATION + 1))/$MAX_ITERATIONS)"
            sleep $WAIT_INTERVAL
            ITERATION=$((ITERATION + 1))
          done

          echo "❌ Timeout: build images not both available after ${MAX_WAIT_MINUTES} minutes ($IMAGE, $AIRLOCK_IMAGE)"
          exit 1

  deploy:
    needs: wait-for-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: deploy
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BLOT_DEPLOY_SSH_KEY }}

      - name: Configure SSH alias
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat >> ~/.ssh/config << EOF
          Host blot
            HostName ${BLOT_DEPLOY_SSH_HOST}
            User deploy
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify SSH connection
        run: ssh blot "echo 'SSH connection successful'"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Deploy via npm script
        run: npm run deploy-node -- ${{ github.sha }}
        env:
          # Skip branch check since we're in CI and may be checking out a specific commit
          SKIP_BRANCH_CHECK: true

      - name: Deployment summary
        if: success()
        run: |
          echo ""
          echo "=========================================="
          echo "Deployment Summary"
          echo "=========================================="
          echo "Commit SHA: ${{ github.sha }}"
          echo "Deployment completed successfully! 🚀"

