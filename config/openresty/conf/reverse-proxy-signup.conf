{{> reverse-proxy-base.conf}}
{{> reverse-proxy-limit-default.conf}}

# Signup POSTs can wait on Stripe or PayPal. Keep the dashboard's 3-minute
# timeout without inheriting reverse-proxy-huge.conf's 1000M upload cap —
# nginx rejects that directive twice in the same location.
proxy_connect_timeout 250ms;
proxy_send_timeout 3m;
proxy_read_timeout 3m;
client_max_body_size 4k;
